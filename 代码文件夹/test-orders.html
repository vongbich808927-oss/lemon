<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成测试订单</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        button {
            background-color: #ff4d00;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin: 10px;
        }
        button:hover {
            background-color: #ff6a33;
        }
        .success {
            color: green;
            margin-top: 10px;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>生成测试订单数据</h1>
    <p>点击下面的按钮生成测试订单，然后刷新"我买到的"页面查看效果。</p>
    <button onclick="generateTestOrders()">生成测试订单</button>
    <button onclick="clearTestOrders()">清除所有订单</button>
    <button onclick="showOrders()">查看当前订单</button>
    <div id="message"></div>
    
    <script>
        function generateTestOrders() {
            // 测试订单数据
            const testOrders = [
                {
                    id: Date.now() - 86400000, // 昨天
                    product: {
                        id: 1,
                        title: 'iPhone 13 128G 午夜色',
                        price: 4500,
                        images: ['https://img.alicdn.com/bao/uploaded/i3/O1CN01vzjGey23jn752cGZz_!!0-fleamarket.jpg_170x10000Q90.jpg_.webp'],
                        condition: '九成新'
                    },
                    seller: {
                        id: 719795072,
                        nickname: '专业手机卖家'
                    },
                    price: 4500,
                    status: 'completed',
                    transactionMethod: '线上支付',
                    createdAt: new Date(Date.now() - 86400000).toISOString()
                },
                {
                    id: Date.now() - 172800000, // 前天
                    product: {
                        id: 2,
                        title: 'AirPods Pro 第二代',
                        price: 1200,
                        images: ['https://img.alicdn.com/imgextra/i1/O1CN01t4Z7vL1O3e3u6Z6kT_!!6000000002580-2-tps-800-800.jpg'],
                        condition: '全新未拆封'
                    },
                    seller: {
                        id: 888888888,
                        nickname: '数码产品专营店'
                    },
                    price: 1200,
                    status: 'completed',
                    transactionMethod: '线上支付',
                    createdAt: new Date(Date.now() - 172800000).toISOString()
                }
            ];
            
            try {
                localStorage.setItem('orders', JSON.stringify(testOrders));
                document.getElementById('message').innerHTML = '<div class="success">测试订单已成功生成！</div>';
            } catch (error) {
                document.getElementById('message').innerHTML = '<div class="error">生成订单失败: ' + error.message + '</div>';
            }
        }
        
        function clearTestOrders() {
            try {
                localStorage.removeItem('orders');
                document.getElementById('message').innerHTML = '<div class="success">所有订单已清除！</div>';
            } catch (error) {
                document.getElementById('message').innerHTML = '<div class="error">清除订单失败: ' + error.message + '</div>';
            }
        }
        
        function showOrders() {
            try {
                const orders = JSON.parse(localStorage.getItem('orders') || '[]');
                document.getElementById('message').innerHTML = '<div class="success">当前订单数量: ' + orders.length + '</div>';
                console.log('当前订单:', orders);
            } catch (error) {
                document.getElementById('message').innerHTML = '<div class="error">查看订单失败: ' + error.message + '</div>';
            }
        }
    </script>
</body>
</html>
