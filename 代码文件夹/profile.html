<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 闲鱼</title>
    <link rel="shortcut icon" href="//img.alicdn.com/tfs/TB19WObTNv1gK0jSZFFXXb0sXXa-144-144.png" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        .header {
            background-color: #ffe60f;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 14px;
            margin-right: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .profile-header {
            background: white;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #f0f0f0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
        }

        .user-info h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .user-info p {
            color: #666;
            font-size: 14px;
        }

        .tabs {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 20px;
        }

        .tab-button {
            padding: 10px 20px;
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #666;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
        }

        .tab-button.active {
            color: #ffe60f;
            border-bottom-color: #ffe60f;
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-2px);
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product-info {
            padding: 12px;
        }

        .product-title {
            font-size: 14px;
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .product-price {
            font-size: 18px;
            font-weight: bold;
            color: #ff4757;
            margin-bottom: 8px;
        }

        .product-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-primary {
            background-color: #ffe60f;
            color: #333;
        }

        .btn-primary:hover {
            background-color: #ffed4a;
        }

        .btn-danger {
            background-color: #ff4757;
            color: white;
        }

        .btn-danger:hover {
            background-color: #ff3838;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .logout-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-left: auto;
        }

        .logout-btn:hover {
            background-color: #ff3838;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div style="display: flex; align-items: center;">
                <a href="index.html" class="back-btn">← 返回</a>
                <div class="logo">
                    <span>🐟</span>
                    <span>个人中心</span>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn">退出登录</button>
        </div>
    </header>

    <div class="container">
        <div class="profile-header" id="profileHeader">
            <div class="avatar">
                <img src="https://img.alicdn.com/imgextra/i4/O1CN01RAAcKC1PuFXey3IFP_!!6000000001900-2-tps-320-320.png_.webp" alt="用户头像" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
            </div>
            <div class="user-info">
                <h2 id="username">加载中...</h2>
                <p id="userEmail">-</p>
            </div>
        </div>

        <div class="tabs">
            <div class="tab-buttons">
                <button class="tab-button active" data-tab="my-products">我发布的</button>
                <button class="tab-button" data-tab="favorites">我的收藏</button>
                <button class="tab-button" data-tab="orders">我的订单</button>
            </div>

            <div class="tab-content active" id="my-products">
                <div class="product-grid" id="myProductsGrid">
                    <div class="empty-state">
                        <img src="https://img.alicdn.com/imgextra/i4/O1CN01RAAcKC1PuFXey3IFP_!!6000000001900-2-tps-320-320.png_.webp" alt="暂无商品" style="width: 200px; height: 200px; margin: 0 auto 20px; display: block; object-fit: contain;">
                        <p>还没有发布商品</p>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="favorites">
                <div class="product-grid" id="favoritesGrid">
                    <div class="empty-state">
                        <img src="https://img.alicdn.com/imgextra/i4/O1CN01RAAcKC1PuFXey3IFP_!!6000000001900-2-tps-320-320.png_.webp" alt="暂无商品" style="width: 200px; height: 200px; margin: 0 auto 20px; display: block; object-fit: contain;">
                        <p>还没有收藏商品</p>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="orders">
                <div id="ordersList">
                    <div class="empty-state">
                        <img src="https://img.alicdn.com/imgextra/i4/O1CN01RAAcKC1PuFXey3IFP_!!6000000001900-2-tps-320-320.png_.webp" alt="暂无商品" style="width: 200px; height: 200px; margin: 0 auto 20px; display: block; object-fit: contain;">
                        <p>还没有订单</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // 检查登录状态
        if (!getToken()) {
            alert('请先登录');
            window.location.href = 'login.html';
        }

        let currentUser = null;

        // 加载用户信息
        async function loadUserInfo() {
            try {
                currentUser = await userAPI.getCurrentUser();
                document.getElementById('username').textContent = currentUser.username || '用户';
                document.getElementById('userEmail').textContent = currentUser.email || currentUser.phone || '-';
            } catch (error) {
                console.error('加载用户信息失败:', error);
            }
        }

        // 加载我的商品
        async function loadMyProducts() {
            try {
                const products = await productAPI.getProducts();
                const myProducts = products.filter(p => p.seller_id === currentUser.id);
                const grid = document.getElementById('myProductsGrid');

                if (myProducts.length === 0) {
                    grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📦</div><p>还没有发布商品</p></div>';
                    return;
                }

                grid.innerHTML = myProducts.map(product => `
                    <div class="product-card" onclick="window.location.href='detail.html?id=${product.id}'">
                        <img src="${product.images && product.images[0] ? product.images[0] : 'https://via.placeholder.com/200'}" alt="${product.title}">
                        <div class="product-info">
                            <div class="product-title">${product.title}</div>
                            <div class="product-price">¥${product.price}</div>
                            <div class="product-actions">
                                <button class="btn btn-primary" onclick="event.stopPropagation(); window.location.href='publish.html?edit=${product.id}'">编辑</button>
                                <button class="btn btn-danger" onclick="event.stopPropagation(); deleteProduct(${product.id})">删除</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('加载商品失败:', error);
            }
        }

        // 删除商品
        async function deleteProduct(id) {
            if (!confirm('确定要删除这个商品吗？')) return;

            try {
                await productAPI.deleteProduct(id);
                alert('删除成功');
                loadMyProducts();
            } catch (error) {
                alert('删除失败：' + error.message);
            }
        }

        // 标签切换
        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
            });
        });

        // 退出登录
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('确定要退出登录吗？')) {
                userAPI.logout();
            }
        });

        // 初始化
        loadUserInfo().then(() => {
            loadMyProducts();
        });
    </script>
</body>
</html>
